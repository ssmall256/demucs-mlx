[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "demucs-mlx"
dynamic = ["version"]
description = "Music source separation with MLX acceleration."
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "ssmall256", email = "ssmall256@users.noreply.github.com"}]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Topic :: Multimedia :: Sound/Audio",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "mlx>=0.32.3,<0.33",
  "mlx-audio-io>=1.3.21,<1.4",
  "mlx-spectro>=0.9.9",
  "numpy",
  "packaging",
  "tqdm",
]

[project.optional-dependencies]
dev = [
  "build",
  "pyright",
  "pytest",
  "ruff",
]

convert = [
  "demucs>=4.0",
  "torch>=2.6",
]

ane = [
  "pyobjc-framework-CoreML>=10; sys_platform == 'darwin'",
]

ane-convert = [
  "coremltools==9.0; sys_platform == 'darwin'",
  "demucs>=4.0",
  "torch>=2.6,<2.8",
]

[project.scripts]
demucs-mlx = "demucs_mlx.separate:main"

[project.urls]
Homepage = "https://github.com/ssmall256/demucs-mlx/"

[tool.uv]
# coremltools 9 needs torch < 2.8; resolve the Core ML converter separately so
# the ordinary conversion extra keeps current PyTorch.
conflicts = [[{ extra = "convert" }, { extra = "ane-convert" }]]

[tool.uv.extra-build-dependencies]
mlx-audio-io = [{ requirement = "mlx[cpu]", match-runtime = true }]

[tool.pyright]
pythonVersion = "3.10"
typeCheckingMode = "basic"
reportMissingImports = "warning"
reportOptionalSubscript = false
reportOptionalOperand = false
reportOptionalMemberAccess = false
reportOptionalIterable = false
reportArgumentType = false
reportAttributeAccessIssue = false
reportIndexIssue = false
reportCallIssue = false
reportRedeclaration = false
reportPrivateImportUsage = false
reportOperatorIssue = false

[tool.ruff]
line-length = 100
exclude = []

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.dynamic]
version = {attr = "demucs_mlx.__version__"}

[tool.setuptools.packages.find]
include = ["demucs_mlx*"]

[tool.setuptools.package-data]
demucs_mlx = ["remote/*.txt", "remote/*.yaml", "csrc/*.m"]
