name: Release (PyPI)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (for example: 1.2.0)"
        required: true
        type: string

concurrency:
  group: release-pypi-${{ inputs.version }}
  cancel-in-progress: false

env:
  PACKAGE_VERSION: ${{ inputs.version }}

jobs:
  build-artifacts:
    name: Build release artifacts
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packaging tools
        run: python -m pip install --upgrade pip build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Validate metadata
        run: python -m twine check dist/*

      - name: Validate requested final version
        run: |
          python - <<'PY'
          import os
          from email.parser import Parser
          from pathlib import Path
          from zipfile import ZipFile

          from packaging.version import Version

          expected = os.environ["PACKAGE_VERSION"]
          parsed = Version(expected)
          if parsed.is_prerelease or parsed.is_devrelease:
              raise SystemExit(f"PyPI requires a final version, got {expected}")

          wheels = list(Path("dist").glob("*.whl"))
          sdists = list(Path("dist").glob("*.tar.gz"))
          if len(wheels) != 1 or len(sdists) != 1:
              raise SystemExit(f"Expected one wheel and one sdist, got {wheels=} {sdists=}")

          with ZipFile(wheels[0]) as archive:
              metadata_path = next(
                  name for name in archive.namelist() if name.endswith(".dist-info/METADATA")
              )
              metadata = Parser().parsestr(archive.read(metadata_path).decode())

          actual = metadata["Version"]
          if actual != expected:
              raise SystemExit(f"Requested {expected}, but built distribution is {actual}")
          print(f"Validated demucs-mlx {actual} release artifacts")
          PY

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-artifacts
          path: dist/*

  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-24.04
    needs: [build-artifacts]
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-artifacts
          path: dist

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          attestations: true

  smoke-macos:
    name: Smoke install from PyPI (macOS)
    runs-on: macos-14
    needs: [publish-pypi]
    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install from PyPI
        run: |
          python -m pip install --upgrade pip
          for i in {1..12}; do
            python -m pip install "demucs-mlx==${PACKAGE_VERSION}" && break
            if [ "$i" -eq 12 ]; then
              exit 1
            fi
            sleep 10
          done

      - name: Smoke test
        run: |
          python -c "
          from demucs_mlx import Separator, list_models, save_audio
          models = list_models()
          print('Models:', models)
          assert 'htdemucs' in models['single']
          import demucs_mlx
          print(f'demucs-mlx {demucs_mlx.__version__} smoke test passed')
          " 2>&1 | head -20
