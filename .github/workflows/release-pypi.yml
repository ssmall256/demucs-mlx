name: Release (PyPI)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (for example: 1.2.0)"
        required: true
        type: string

concurrency:
  group: release-pypi-${{ inputs.version }}
  cancel-in-progress: false

env:
  PACKAGE_VERSION: ${{ inputs.version }}

jobs:
  build-artifacts:
    name: Build release artifacts
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install packaging tools
        run: python -m pip install --upgrade pip build twine

      - name: Set version from workflow input
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          version = os.environ["PACKAGE_VERSION"]
          path = Path("demucs_mlx/__init__.py")
          source = path.read_text()
          patched, count = re.subn(
              r'^__version__ = ".*"$',
              f'__version__ = "{version}"',
              source,
              count=1,
              flags=re.MULTILINE,
          )
          if count != 1:
              raise SystemExit(f"Could not find __version__ in {path}")
          path.write_text(patched)
          print(f"Building demucs-mlx {version}")
          PY

      - name: Build sdist and wheel
        run: python -m build

      - name: Validate metadata
        run: python -m twine check dist/*

      - name: Validate requested final version
        run: |
          python - <<'PY'
          import os
          from email.parser import Parser
          from pathlib import Path
          from zipfile import ZipFile

          from packaging.version import Version

          expected = os.environ["PACKAGE_VERSION"]
          parsed = Version(expected)
          if parsed.is_prerelease or parsed.is_devrelease:
              raise SystemExit(f"PyPI requires a final version, got {expected}")

          wheels = list(Path("dist").glob("*.whl"))
          sdists = list(Path("dist").glob("*.tar.gz"))
          if len(wheels) != 1 or len(sdists) != 1:
              raise SystemExit(f"Expected one wheel and one sdist, got {wheels=} {sdists=}")

          with ZipFile(wheels[0]) as archive:
              metadata_path = next(
                  name for name in archive.namelist() if name.endswith(".dist-info/METADATA")
              )
              metadata = Parser().parsestr(archive.read(metadata_path).decode())

          actual = metadata["Version"]
          if actual != expected:
              raise SystemExit(f"Requested {expected}, but built distribution is {actual}")
          print(f"Validated demucs-mlx {actual} release artifacts")
          PY

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist-artifacts
          path: dist/*

  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-24.04
    needs: [build-artifacts]
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist-artifacts
          path: dist

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
          attestations: true

  smoke-macos:
    name: Smoke install from PyPI (macOS)
    runs-on: macos-14
    needs: [publish-pypi]
    steps:
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Resolve the published demucs-mlx artifact
        run: |
          # pip resolves against the PEP 691 JSON rendering of
          # /simple/<project>/. That rendering is cached separately from the
          # PEP 503 HTML one and the two can serve different snapshots of the
          # same URL, so a freshly published version may be invisible to pip
          # while every other view of PyPI already shows it. Ask the release
          # API for the file directly, which sits outside that split, and
          # install the artifact by URL.
          python - <<'PY' >> "${GITHUB_ENV}"
          import json
          import os
          import time
          import urllib.request

          name = "demucs-mlx"
          version = os.environ["PACKAGE_VERSION"]
          api = f"https://pypi.org/pypi/{name}/{version}/json"

          for _ in range(60):
              try:
                  with urllib.request.urlopen(api, timeout=30) as response:
                      files = json.load(response)["urls"]
              except Exception:
                  files = []
              for kind in ("bdist_wheel", "sdist"):
                  for entry in files:
                      if entry["packagetype"] == kind:
                          print(f"ARTIFACT_URL={entry['url']}")
                          raise SystemExit(0)
              time.sleep(10)

          raise SystemExit(
              f"{name} {version} did not reach PyPI within 10 minutes"
          )
          PY

      - name: Install demucs-mlx from the resolved artifact
        run: |
          python -m pip install --upgrade pip
          # The artifact URL is exact, but dependencies still resolve through
          # the index, so retry: a freshly published dependency can be missing
          # from the mirror pip reads. A resolution failure costs nothing.
          for attempt in {1..8}; do
            if python -m pip install --no-cache-dir \
              "${ARTIFACT_URL}"; then
              break
            fi
            if [ "${attempt}" -eq 8 ]; then
              echo "Could not install ${ARTIFACT_URL}" >&2
              exit 1
            fi
            sleep 15
          done

      - name: Smoke test
        run: |
          python -c "
          from demucs_mlx import Separator, list_models, save_audio
          models = list_models()
          print('Models:', models)
          assert 'htdemucs' in models['single']
          import demucs_mlx
          print(f'demucs-mlx {demucs_mlx.__version__} smoke test passed')
          " 2>&1 | head -20
