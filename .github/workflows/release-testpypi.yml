name: Release RC (TestPyPI)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish and verify (for example: 1.2.0rc1)"
        required: true
        type: string

concurrency:
  group: release-testpypi-${{ inputs.version }}
  cancel-in-progress: false

env:
  PACKAGE_VERSION: ${{ inputs.version }}

jobs:
  build-artifacts:
    name: Build RC artifacts
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packaging tools
        run: python -m pip install --upgrade pip build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Validate metadata
        run: python -m twine check dist/*

      - name: Validate requested prerelease version
        run: |
          python - <<'PY'
          import os
          from email.parser import Parser
          from pathlib import Path
          from zipfile import ZipFile

          from packaging.version import Version

          expected = os.environ["PACKAGE_VERSION"]
          parsed = Version(expected)
          if not parsed.is_prerelease:
              raise SystemExit(f"TestPyPI requires a prerelease version, got {expected}")

          wheels = list(Path("dist").glob("*.whl"))
          sdists = list(Path("dist").glob("*.tar.gz"))
          if len(wheels) != 1 or len(sdists) != 1:
              raise SystemExit(f"Expected one wheel and one sdist, got {wheels=} {sdists=}")

          with ZipFile(wheels[0]) as archive:
              metadata_path = next(
                  name for name in archive.namelist() if name.endswith(".dist-info/METADATA")
              )
              metadata = Parser().parsestr(archive.read(metadata_path).decode())

          actual = metadata["Version"]
          if actual != expected:
              raise SystemExit(f"Requested {expected}, but built distribution is {actual}")
          print(f"Validated demucs-mlx {actual} release artifacts")
          PY

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-artifacts
          path: dist/*

  publish-testpypi:
    name: Publish to TestPyPI
    runs-on: ubuntu-24.04
    needs: [build-artifacts]
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-artifacts
          path: dist

      - name: Publish package distributions to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          attestations: false

  smoke-macos:
    name: Smoke install from TestPyPI (macOS)
    runs-on: macos-14
    needs: [publish-testpypi]
    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Wait for and download from TestPyPI
        run: |
          python -m pip install --upgrade pip
          wheel_dir="${RUNNER_TEMP}/demucs-mlx-wheel"
          mkdir -p "${wheel_dir}"
          for attempt in {1..60}; do
            if python -m pip download \
              --no-deps \
              --no-cache-dir \
              --only-binary=:all: \
              --dest "${wheel_dir}" \
              --index-url https://test.pypi.org/simple/ \
              --extra-index-url https://pypi.org/simple \
              "demucs-mlx==${PACKAGE_VERSION}"; then
              break
            fi
            if [ "${attempt}" -eq 60 ]; then
              echo "demucs-mlx ${PACKAGE_VERSION} did not reach TestPyPI within 10 minutes" >&2
              exit 1
            fi
            sleep 10
          done

          shopt -s nullglob
          wheels=("${wheel_dir}"/demucs_mlx-"${PACKAGE_VERSION}"-*.whl)
          if [ "${#wheels[@]}" -ne 1 ]; then
            echo "Expected exactly one demucs-mlx ${PACKAGE_VERSION} wheel, found ${#wheels[@]}" >&2
            exit 1
          fi
          echo "WHEEL_PATH=${wheels[0]}" >> "${GITHUB_ENV}"

      - name: Install downloaded wheel
        run: python -m pip install --no-cache-dir "${WHEEL_PATH}"

      - name: Smoke test
        run: |
          python -c "
          from demucs_mlx import Separator, list_models, save_audio
          models = list_models()
          print('Models:', models)
          assert 'htdemucs' in models['single']
          import demucs_mlx
          print(f'demucs-mlx {demucs_mlx.__version__} smoke test passed')
          " 2>&1 | head -20
