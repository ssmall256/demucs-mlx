name: tests
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  lint:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: "3.12"

    - name: Install uv
      run: curl -LsSf https://astral.sh/uv/install.sh | sh

    - name: Install dependencies
      run: uv sync --extra dev

    - name: Lint
      run: uv run ruff check demucs_mlx tests

    - name: Type check
      run: uv run pyright

  test:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: "3.12"

    - name: Install uv
      run: curl -LsSf https://astral.sh/uv/install.sh | sh

    - name: Install dependencies
      run: uv sync

    - name: Run kernel tests
      run: uv run python tests/test_metal_kernels.py

    - name: Run apply_model chunk/seed regression
      run: uv run python tests/test_apply_model_chunk_seed.py

    - name: Run optional mlx-weights integration regression
      run: uv run python tests/test_model_converter_optional_mlx_weights.py

    - name: Run safe-cache regressions without conversion dependencies
      run: uv run python tests/test_demucs_security.py

    - name: Run apply_model overlap-add regression
      run: uv run python tests/test_apply_model_overlap_add.py

    - name: Run audio resampling regression
      run: uv run python tests/test_resample.py

    - name: Run default batch-size regression
      run: uv run python tests/test_default_batch_size.py

    - name: Run audio prefetch stream regression
      run: uv run python tests/test_prefetch_thread_stream.py

    - name: Test CLI
      run: uv run demucs-mlx --list-models

    - name: Test import
      run: |
        uv run python -c "
        from demucs_mlx import Separator, save_audio, list_models
        models = list_models()
        print('Models:', models)
        assert 'htdemucs' in models['single']
        print('Import test passed')
        "

  conversion-security:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: "3.12"

    - name: Install uv
      run: curl -LsSf https://astral.sh/uv/install.sh | sh

    - name: Install conversion and test dependencies
      run: uv sync --extra dev --extra convert

    - name: Run checkpoint and cache security regressions
      run: uv run python tests/test_demucs_security.py
